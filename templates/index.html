<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            color:#333;
        }

        /* Navbar */

        nav{
            background:#007bff;
            padding:15px 50px;
            color:white;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        nav h1{
            font-size:24px;
        }

        /* Hero Section */

        .hero{
            height:90vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:50px;
        }

        .hero-content{
            display:flex;
            align-items:center;
            justify-content:space-between;
            width:100%;
            max-width:1200px;
        }

        .left{
            width:50%;
        }

        .left h2{
            font-size:48px;
            margin-bottom:20px;
            color:#222;
        }

        .left p{
            font-size:18px;
            line-height:1.6;
            margin-bottom:25px;
        }

        .left button{
            padding:14px 28px;
            border:none;
            background:#007bff;
            color:white;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
        }

        .left button:hover{
            background:#0056b3;
        }

        /* Prediction Card */

        .right{
            width:40%;
        }

        .card{
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0px 4px 20px rgba(0,0,0,0.1);
        }

        .card h3{
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:14px;
        }

        .predict-btn{
            width:100%;
            padding:12px;
            border:none;
            background:#007bff;
            color:white;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
        }

        .predict-btn:hover{
            background:#0056b3;
        }

        .result{
            margin-top:20px;
            text-align:center;
            font-size:18px;
            font-weight:bold;
            color:#222;
        }

    </style>
</head>

<body>

    <!-- Navbar -->

    <nav>
        <h1>ChurnPredict AI</h1>
    </nav>

    <!-- Hero Section -->

    <section class="hero">

        <div class="hero-content">

            <!-- Left Content -->

            <div class="left">

                <h2>Customer Churn Prediction System</h2>

                <p>
                    Analyze customer behavior and predict potential churn using
                    Machine Learning, Python, Flask, SQL Server, and Power BI.
                </p>

                <button>AI Powered Analytics</button>

            </div>

            <!-- Right Prediction Form -->

            <div class="right">

                <div class="card">

                    <h3>Predict Customer Churn</h3>

                    <form action="/predict" method="post">

                        <input type="text" name="tenure" placeholder="Enter Tenure">

                        <input type="text" name="monthlycharges" placeholder="Enter Monthly Charges">

                        <input type="text" name="totalcharges" placeholder="Enter Total Charges">

                        <button class="predict-btn" type="submit">
                            Predict
                        </button>

                    </form>

                    <div class="result">
                        {{ prediction_text }}
                    </div>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
